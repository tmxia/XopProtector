name: Build XopProtector APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:      # 支持手动点击触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: gradle

    - name: Decode Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
        echo "storeFile=keystore.jks" >> app/keystore.properties
        echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> app/keystore.properties
        echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> app/keystore.properties
        echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> app/keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XopProtector-Release
        path: "**/build/outputs/apk/release/*.apk"

    # 可选：如果 Tag 包含 v*，自动发布到 Release
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: "**/build/outputs/apk/release/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
