name: Build XopProtector APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# 自动取消正在运行的旧任务，确保只运行最新一次提交
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: gradle

    - name: Read Version from build.gradle.kts
      id: get_version
      run: |
        VERSION_NAME=$(grep -oE 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/versionName\s*=\s*"([^"]+)"/\1/')
        VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | head -1 | sed -E 's/versionCode\s*=\s*([0-9]+)/\1/')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "✅ 读取到版本号: v$VERSION_NAME (Code: $VERSION_CODE)"

    - name: Decode Keystore
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks
        echo "storeFile=keystore.jks" >> app/keystore.properties
        echo "storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}" >> app/keystore.properties
        echo "keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}" >> app/keystore.properties
        echo "keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}" >> app/keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Rename and Collect APK
      run: |
        mkdir -p output
        for f in $(find . -name "*.apk" -path "*/build/outputs/apk/release/*"); do
          cp "$f" "output/XopProtector-v${{ steps.get_version.outputs.VERSION_NAME }}.apk"
        done

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: XopProtector-v${{ steps.get_version.outputs.VERSION_NAME }}
        path: output/*.apk

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION_NAME }}
        name: Release v${{ steps.get_version.outputs.VERSION_NAME }}
        body: |
          Auto-built APK by GitHub Actions.
          - **App 版本**: v${{ steps.get_version.outputs.VERSION_NAME }}
        files: output/*.apk
        draft: false
        prerelease: false
        overwrite_files: true
        make_latest: true
        target: main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────
  # 自动清理历史记录，只保留最新一条
  # ─────────────────────────────────────────
  cleanup_old_runs:
    name: 清理历史记录
    runs-on: ubuntu-latest
    if: always()
    permissions:
      actions: write
    needs: [build]
    steps:
      - name: Delete old runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build.yml',
              per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              if (run.id !== context.runId && run.status === 'completed') {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    run_id: run.id
                  });
                } catch (e) {
                  console.log(`Failed to delete ${run.id}: ${e.message}`);
                }
              }
            }
